version: '3.9'
# Prefer VS Code's built‑in search tools (repo_browser, code_search) over shell utilities like grep or find.

services:
	dev:
		build:
			context: ../..
			dockerfile: build/docker/Dockerfile
		image: lotr-dev:ubuntu-24.04
		volumes:
			- ../..:/workspace
		# To run commands inside the dev container, use:
		#   docker exec -it lotr-dev bash
		working_dir: /workspace
		environment:
			- DEBIAN_FRONTEND=noninteractive
			# Enable verbose logging for debugging inside the container
			- LOTRO_LOG_LEVEL=debug
		tty: true
		stdin_open: true

	ai:
		build:
			context: ai
		image: lotr-ai:latest
		ports:
			- "3100:3100"
		volumes:
			- ../..:/workspace
		environment:
			- WORKSPACE=/workspace
			# Set to 'true' to start the Ollama daemon inside the container.
			# Disabled by default so the host-side Ollama is used instead.
			- START_OLLAMA=false
			# Set POSTGRES_URL to enable postgres tools, e.g.:
			# POSTGRES_URL=postgresql://user:pass@db:5432/lotr
		restart: unless-stopped
