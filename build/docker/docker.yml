version: '3.9'

services:
	dev:
		build:
			context: ../..
			dockerfile: build/docker/Dockerfile
		image: lotr-dev:ubuntu-24.04
		volumes:
			- ../..:/workspace
		working_dir: /workspace
		environment:
			- DEBIAN_FRONTEND=noninteractive
		tty: true
		stdin_open: true

	ai:
		build:
			context: ai
		image: lotr-ai:latest
		ports:
			- "3100:3100"
		volumes:
			- ../..:/workspace
		environment:
			- WORKSPACE=/workspace
			# Set POSTGRES_URL to enable postgres tools, e.g.:
			# POSTGRES_URL=postgresql://user:pass@db:5432/lotr
		restart: unless-stopped
