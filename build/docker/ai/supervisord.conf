[supervisord]
nodaemon=true

[program:ollama]
command=/usr/local/bin/ollama serve --host 0.0.0.0 --port 11434
autostart=true
autorestart=true
stdout_logfile=/var/log/ollama.log
stderr_logfile=/var/log/ollama.err

[program:mcp]
command=python3 /app/server.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/mcp.log
stderr_logfile=/var/log/mcp.err
[supervisord]
nodaemon=true

[program:ollama]
command=/usr/local/bin/ollama daemon --data-dir /ollama-cache
autorestart=true
stdout_logfile=/var/log/ollama.log
stderr_logfile=/var/log/ollama.err

[program:mcp]
command=python /app/server.py
autorestart=true
stdout_logfile=/var/log/mcp.log
stderr_logfile=/var/log/mcp.err
