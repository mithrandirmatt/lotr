[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotr_server"
version = "0.1.0"
description = "Host-referee server for the LotR TCG engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.95",
    "uvicorn[standard]>=0.22",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.0.0",
    "alembic>=1.13",
    "pydantic[email]>=2.0",
    "email-validator>=2.0",
    "python-multipart>=0.0.7",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
include = ["server", "server.*"]
