debug/export_console_script=false
performance/texture_import/etcpng_compression_level=2
performance/texture_import/s3tc_compression_level=2
performance/texture_import/etc2_compression_level=2
performance/texture_import/vram_compression=0
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@example.com"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/bin/bash
export DISPLAY=:0
cd '/tmp/godot_remote'
./lotr-tcg.x86_64"
ssh_remote_deploy/cleanup_script="#!/bin/bash
rm -rf '/tmp/godot_remote'"
